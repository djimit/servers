name: Security regressions
on:
  pull_request:
    paths: ['package*.json', 'src/everything/**', 'src/filesystem/**', 'src/github/**', 'src/gitlab/**', 'src/redis/**', 'src/puppeteer/**', 'scripts/**', '.github/workflows/security-regressions.yml']
  push:
    branches: [main]
    paths: ['package*.json', 'src/everything/**', 'src/filesystem/**', 'src/github/**', 'src/gitlab/**', 'src/redis/**', 'src/puppeteer/**', 'scripts/**', '.github/workflows/security-regressions.yml']
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npx --yes --package=npm@12.2.1 npm ci --ignore-scripts
      - run: npm run build --workspaces
      - run: node --test scripts/schema-contract.test.mjs scripts/schema-defaults.test.cjs scripts/http-dependency.test.cjs
